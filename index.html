<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "on-surface": "#ece9f1",
                "on-surface-variant": "#a39fb0",
                "surface-deep-black": "#0d0c11",
                "surface-container-low": "#16151c",
                "surface-container": "#1f1d26",
                "border-hairline": "#2a2833",
                "primary": "#d0bcff",
                "action-lavender": "#d0bcff",
                "display-mint": "#b9f2c8",
                "accent-pink": "#ffd8e4",
                "on-primary": "#381e72",
                "surface-bright": "#1f1d26",
                "outline": "#2a2833",
                "background": "#0d0c11"
            },
            "borderRadius": {
                "sm": "4px",
                "md": "10px",
                "DEFAULT": "16px",
                "lg": "16px",
                "xl": "24px",
                "full": "9999px"
            },
            "spacing": {
                "margin-mobile": "1.5rem",
                "stack-sm": "1rem",
                "gutter": "1.5rem",
                "container-max": "1320px",
                "margin-desktop": "4rem",
                "stack-md": "2rem",
                "stack-lg": "4rem"
            },
            "fontFamily": {
                "label-caps": ["IBM Plex Mono", "JetBrains Mono", "monospace"],
                "label-md": ["Hanken Grotesk", "Inter", "sans-serif"],
                "display-hero": ["Anton", "Neudron", "sans-serif"],
                "headline-md": ["Hanken Grotesk", "Inter", "sans-serif"],
                "headline-lg": ["Hanken Grotesk", "Inter", "sans-serif"],
                "body-lg": ["Hanken Grotesk", "Inter", "sans-serif"],
                "display-hero-mobile": ["Anton", "sans-serif"],
                "body-md": ["Hanken Grotesk", "Inter", "sans-serif"]
            },
            "fontSize": {
                "label-caps": ["clamp(0.8rem, 1.1vw, 1.05rem)", {"lineHeight": "1.2", "letterSpacing": "0.08em", "fontWeight": "500"}],
                "label-md": ["14px", {"lineHeight": "1.4", "fontWeight": "500"}],
                "display-hero": ["clamp(2.6rem, 14.5vw, 13rem)", {"lineHeight": "0.92", "letterSpacing": "-0.03em", "fontWeight": "700"}],
                "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                "headline-lg": ["clamp(2.8rem, 7.6vw, 6.4rem)", {"lineHeight": "1.05", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                "body-lg": ["clamp(1rem, 1.6vw, 1.55rem)", {"lineHeight": "1.6", "fontWeight": "400"}],
                "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
    <title>Meng Wen - Product Designer &amp; Design Lead</title>
  </head>
  <body class="bg-surface-deep-black text-on-surface font-body-md overflow-x-hidden selection:bg-primary/30">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
