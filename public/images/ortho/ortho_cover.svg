<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#141922" rx="12"/>
  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="40" fill="#1C2330" rx="12"/>
  <circle cx="24" cy="20" r="6" fill="#FF5F56"/>
  <circle cx="44" cy="20" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="20" r="6" fill="#27C93F"/>
  <text x="400" y="24" fill="#A7ADB8" font-family="monospace" font-size="12" text-anchor="middle">ORTHODONTIC_STATE_MACHINE_FUNNEL_V2.0</text>
  
  <!-- Content Area: Funnel Visualization -->
  <rect x="30" y="60" width="740" height="360" fill="#0B0F14" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="50" y="90" fill="#B8E6D0" font-family="monospace" font-size="14" font-weight="bold">CONVERSION FUNNEL (30-40% → 50-60%)</text>
  
  <!-- Funnel Stage Bars -->
  <!-- Stage 1 -->
  <rect x="50" y="115" width="680" height="40" fill="#1C2330" rx="6"/>
  <rect x="50" y="115" width="680" height="40" fill="rgba(184, 230, 208, 0.2)" rx="6" stroke="#B8E6D0" stroke-width="1.5"/>
  <text x="70" y="140" fill="#F2F2F5" font-family="sans-serif" font-size="13" font-weight="bold">1. System Target Recommendation</text>
  <text x="710" y="140" fill="#B8E6D0" font-family="monospace" font-size="13" text-anchor="end">9,274 Patients (100%)</text>

  <!-- Stage 2 -->
  <rect x="50" y="170" width="680" height="40" fill="#1C2330" rx="6"/>
  <rect x="50" y="170" width="335" height="40" fill="rgba(200, 182, 255, 0.2)" rx="6" stroke="#C8B6FF" stroke-width="1.5"/>
  <text x="70" y="195" fill="#F2F2F5" font-family="sans-serif" font-size="13" font-weight="bold">2. Pediatric Screening Handoff</text>
  <text x="710" y="195" fill="#C8B6FF" font-family="monospace" font-size="13" text-anchor="end">4,579 Patients (49.4%)</text>

  <!-- Stage 3 -->
  <rect x="50" y="225" width="680" height="40" fill="#1C2330" rx="6"/>
  <rect x="50" y="225" width="301" height="40" fill="rgba(200, 182, 255, 0.25)" rx="6" stroke="#C8B6FF" stroke-width="1.5"/>
  <text x="70" y="250" fill="#F2F2F5" font-family="sans-serif" font-size="13" font-weight="bold">3. Conclusion Submitted</text>
  <text x="710" y="250" fill="#C8B6FF" font-family="monospace" font-size="13" text-anchor="end">4,110 Patients (44.3%)</text>

  <!-- Stage 4 -->
  <rect x="50" y="280" width="680" height="40" fill="#1C2330" rx="6"/>
  <rect x="50" y="280" width="180" height="40" fill="rgba(184, 230, 208, 0.3)" rx="6" stroke="#B8E6D0" stroke-width="1.5"/>
  <text x="70" y="305" fill="#F2F2F5" font-family="sans-serif" font-size="13" font-weight="bold">4. Ortho Treatment Required</text>
  <text x="710" y="305" fill="#B8E6D0" font-family="monospace" font-size="13" text-anchor="end">2,466 Patients (26.6%)</text>

  <!-- Stage 5 -->
  <rect x="50" y="335" width="680" height="40" fill="#1C2330" rx="6"/>
  <rect x="50" y="335" width="91" height="40" fill="#B8E6D0" rx="6"/>
  <text x="70" y="360" fill="#141922" font-family="sans-serif" font-size="13" font-weight="bold">5. Treatment Lock &amp; Appointment</text>
  <text x="710" y="360" fill="#B8E6D0" font-family="monospace" font-size="14" font-weight="bold" text-anchor="end">1,239 Patients (50-60% Conversion Lock)</text>
</svg>
